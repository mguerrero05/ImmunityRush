<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Immunity Rush — Scan to Play</title>
    <style>
      :root {
        --blue: #1f6feb;
        --deep: #0f4c81;
        --teal: #2bb3b3;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
        color: var(--deep);
      }
      .poster {
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        padding: 56px 48px;
        text-align: center;
      }
      .eyebrow {
        letter-spacing: 3px;
        font-weight: 800;
        color: var(--teal);
        font-size: 18px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      h1 {
        font-size: 62px;
        line-height: 1.02;
        margin: 0 0 6px;
        color: var(--blue);
      }
      .tagline {
        font-size: 24px;
        font-weight: 600;
        margin: 0 0 34px;
      }
      .qr-frame {
        display: inline-block;
        padding: 26px;
        border-radius: 28px;
        background: #fff;
        border: 4px solid var(--blue);
        box-shadow: 0 18px 40px rgba(15, 76, 129, 0.18);
      }
      .qr-frame img {
        display: block;
        width: 360px;
        height: 360px;
      }
      .scan {
        font-size: 30px;
        font-weight: 800;
        margin: 30px 0 6px;
      }
      .url {
        font-size: 19px;
        font-weight: 600;
        color: var(--blue);
        word-break: break-all;
      }
      .foot {
        margin-top: 30px;
        font-size: 16px;
        color: #5b6b7e;
      }
      @media print {
        .poster {
          padding: 40px;
        }
      }
    </style>
  </head>
  <body>
    <div class="poster">
      <div class="eyebrow">SHN · Flu Season</div>
      <h1>Immunity&nbsp;Rush</h1>
      <p class="tagline">Beat flu season — play the hospital maze!</p>

      <div class="qr-frame">
        <img src="immunity-rush-qr.png" alt="QR code to play Immunity Rush" />
      </div>

      <p class="scan">📱 Scan to play</p>
      <p class="url">mguerrero05.github.io/ImmunityRush</p>

      <p class="foot">Point your phone camera at the code — no app needed.</p>
    </div>
  </body>
</html>
